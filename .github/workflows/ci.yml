name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # ─── Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: ESLint
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

  # ─── Build ────────────────────────────────────────────────────────────────
  build:
    name: Vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          # Provide placeholder values so the build doesn't fail on missing vars.
          # Real secrets are server-side and never in VITE_ vars.
          VITE_JIRA_BASE_URL: https://example.atlassian.net
          VITE_JIRA_PROJECT_ID: '10000'
          VITE_JIRA_PROJECT_KEY: PESD1
          VITE_JIRA_REPORTER_ID: placeholder

      - name: Verify no secrets in bundle
        run: |
          echo "Checking dist/ for leaked secrets..."
          if grep -r "JIRA_API_TOKEN\|sk-ant\|anthropic_api_key" dist/ 2>/dev/null | grep -v "VITE_"; then
            echo "❌ SECRET FOUND IN BUNDLE"
            exit 1
          fi
          echo "✅ No secrets found in bundle"

  # ─── E2E smoke tests ──────────────────────────────────────────────────────
  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:e2e
        env:
          VITE_JIRA_BASE_URL: https://example.atlassian.net
          VITE_JIRA_PROJECT_ID: '10000'
          VITE_JIRA_PROJECT_KEY: PESD1
          VITE_JIRA_REPORTER_ID: placeholder

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
